name: bibliotecadb

services:
  bibliotecadb:
    image: postgres:latest
    container_name: bibliotecadb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biblioteca
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - biblioteca-network

  pgadmin4:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: unless-stopped
    ports:
      - "15432:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - biblioteca-network
    depends_on:
      - bibliotecadb

volumes:
  postgres_data:
    name: biblioteca_postgres_data

networks:
  biblioteca-network:
    name: biblioteca-network
    driver: bridge
